<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty of Corn</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff7e6, #fde2f3);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            max-width: 700px;
            width: 90%;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .content {
            padding: 30px;
        }

        .content h1 {
            margin: 0 0 15px;
            font-size: 2.2rem;
            color: #9c27b0;
        }

        .content p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .highlight {
            font-size: 1.4rem;
            font-weight: 600;
            color: #ff9800;
        }

        @media (max-width: 480px) {
            .content h1 {
                font-size: 1.8rem;
            }

            .highlight {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="content">
            <h1>Beauty of Corn</h1>
            <img src="/ChatGPT Image Jan 8, 2026, 12_38_26 PM.png" alt="Beauty of Corn">
            <p>
                Kukurūza sevī ietver B, E un K vitamīnus, kā arī magniju un kāliju,
                kas palīdz uzturēt skaistumu un veselību.
            </p>
            <div class="highlight">
                Jau drīz kukurūza darīs tevi skaistāku!
            </div>
        </div>
    </div>

</body>
</html>
